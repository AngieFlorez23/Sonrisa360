{% extends 'core/base.html' %}{% block title %}Mi perfil{% endblock %}{% block content %}<h2>Mi perfil</h2><p>Usuario: <strong>{{ cuenta.usuario }}</strong> · Rol: {{ cuenta.rol }}</p>
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Correo para recuperar acceso</label><input class="form-control" type="email" name="correo_electronico" value="{{ cuenta.correo_electronico }}"></div><div class="mb-3"><label class="form-label">Contraseña actual (obligatoria para guardar)</label><input required class="form-control" type="password" name="clave_actual"></div><div class="mb-3"><label class="form-label">Nueva contraseña (opcional)</label><input class="form-control" type="password" name="clave_nueva"></div><button class="btn btn-primary">Guardar cambios</button></form></div></div>{% endblock %}
